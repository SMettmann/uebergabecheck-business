name: Final legal review patch
on:
  push:
    branches: [main]
    paths:
      - '.github/final-legal-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final legal review
        run: python scripts/final_legal_review_patch.py
      - name: Validate legal version and JavaScript
        run: |
          grep -q 'BUSINESS_TERMS_VERSION="2026-08-27"' index.html
          grep -q 'BUSINESS_AVV_VERSION="2026-08-27"' index.html
          grep -q 'authorized_to_bind' index.html
          grep -q 'STRATO GmbH' index.html
          grep -q 'Externe Bibliotheken und Content-Delivery-Netzwerke' index.html
          grep -q 'Steuerbefreiung für Kleinunternehmer' index.html
          grep -q 'berechtigt bin, diese Vereinbarungen für das Unternehmen abzuschließen' index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.rfind('<script>')
          end=s.rfind('</script>')
          if start < 0 or end < start: raise SystemExit('script block not found')
          Path('/tmp/app.js').write_text(s[start+8:end],encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit reviewed version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/final-legal-trigger.txt .github/workflows/final-legal-review.yml scripts/final_legal_review_patch.py
          git add index.html
          git commit -m 'Finalize B2B legal terms and privacy disclosures'
          git push origin main
