name: Fix password reset message

on:
  push:
    branches:
      - feature/password-reset-message
    paths:
      - .github/workflows/fix-password-reset-message.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/password-reset-message

      - name: Improve password reset errors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''  if(updateError){\n    console.error("Passwort ändern:",updateError);\n    if(error){error.textContent="Das Passwort konnte nicht geändert werden. Bitte den Reset-Link erneut öffnen.";error.classList.remove("hidden");}\n    return;\n  }'''
          new='''  if(updateError){\n    console.error("Passwort ändern:",updateError);\n    const resetMessage=String(updateError?.message || "").toLowerCase();\n    let userMessage="Das Passwort konnte nicht geändert werden.";\n    if(resetMessage.includes("different from the old password") || resetMessage.includes("same password") || resetMessage.includes("should be different")){\n      userMessage="Das neue Passwort darf nicht mit deinem bisherigen Passwort identisch sein. Bitte wähle ein anderes Passwort.";\n    }else if(resetMessage.includes("expired") || resetMessage.includes("invalid") || resetMessage.includes("session")){\n      userMessage="Der Reset-Link ist nicht mehr gültig. Bitte fordere einen neuen Reset-Link an.";\n    }\n    if(error){error.textContent=userMessage;error.classList.remove("hidden");}\n    return;\n  }'''
          assert old in s, 'password reset error block not found'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>',html,re.S)
          for i,script in enumerate(scripts):
              Path(f'/tmp/inline-{i}.js').write_text(script,encoding='utf-8')
          PY
          for f in /tmp/inline-*.js; do node --check "$f"; done
          grep -q 'Das neue Passwort darf nicht mit deinem bisherigen Passwort identisch sein' index.html

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-password-reset-message.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-password-reset-message.yml
          git commit -m "Clarify password reset errors"
          git push origin HEAD:feature/password-reset-message
