          grep -q 'keine automatische Umwandlung' index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert s.count('id="agbOverlay"')==1
          assert s.count('id="avvOverlay"')==1
          assert s.count('id="datenschutzOverlay"')==1
          assert s.count('id="businessLegalGate"')==1
