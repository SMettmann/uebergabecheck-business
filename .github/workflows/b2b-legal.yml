          meta_new='''        company_name: company,\n        contact_name: contact,\n        account_type: "business",\n        b2b_confirmed: true,\n        legal_terms_version: BUSINESS_TERMS_VERSION,\n        avv_version: BUSINESS_AVV_VERSION,\n        legal_accepted_at: new Date().toISOString()\n'''
          rep(meta_anchor,meta_new)

