name: Business prelaunch cleanup

on:
  push:
    branches:
      - feature/business-prelaunch-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/business-prelaunch-cleanup

      - name: Apply bundled Business cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'Missing expected block: {label}')
              text = text.replace(old, new, 1)

          # 1/7: contact + title
          replace_once('<title>ÜbergabeCheck – Wohnungsübergabe</title>', '<title>ÜbergabeCheck Business – Digitale Wohnungsübergaben</title>', 'page title')
          replace_once('E-Mail: <strong>[DEINE E-MAIL-ADRESSE EINTRAGEN]</strong>', 'E-Mail: <strong>info@uebergabe-check.de</strong>', 'privacy email')

          # 8/9: clean malformed style nesting and obsolete prototype CSS
          text = text.replace('  .login-demo-badge{display:inline-block;margin-top:12px;font-size:11px;color:#777;background:#f7f7f8;border-radius:8px;padding:6px 8px}\n', '', 1)
          replace_once('\n<style>\n.status.open', '\n.status.open', 'nested style opener')
          replace_once('</style>\n</style>\n<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>', '</style>\n<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>', 'double style closer')

          # 5: legal links visible before login/registration
          login_close = '''</div>\n</div>\n</section>\n<div class="transfer-start-modal hidden" id="transferStartModal"'''
          login_close_new = '''</div>\n</div>\n<div class="site-footer login-legal">\n  ÜbergabeCheck Business · <a onclick="openImpressum()">Impressum</a> · <a onclick="openDatenschutz()">Datenschutz</a>\n</div>\n</section>\n<div class="transfer-start-modal hidden" id="transferStartModal"'''
          replace_once(login_close, login_close_new, 'login legal footer')

          # 12/13: object stats + honest dashboard label
          replace_once('<div class="dashboard-stat"><span>Aktive Übergaben</span><strong>0</strong></div>', '<div class="dashboard-stat"><span>Übergaben</span><strong>0</strong></div>', 'dashboard transfer label')
          replace_once('<div><span>Übergaben</span><strong>0</strong></div>\n<div><span>Offene Mängel</span><strong>0</strong></div>', '<div><span>Übergaben</span><strong id="objectTransferCount">0</strong></div>\n<div><span>Offene Mängel</span><strong id="objectOpenDefectCount">0</strong></div>', 'object detail stat ids')

          # 2/3/4: rewrite privacy around actual Business data flow and Supabase
          start = text.find('<h3>2. Allgemeine Hinweise</h3>')
          end = text.find('<h3>4. Webanalyse mit Umami</h3>', start)
          if start < 0 or end < 0:
              raise SystemExit('Privacy sections 2-4 not found')
          privacy = '''<h3>2. Allgemeine Hinweise</h3>\n<p>\n      ÜbergabeCheck Business ist eine Webanwendung zur zentralen Verwaltung von Objekten, Wohnungen,\n      Wohnungsübergaben und festgestellten Mängeln. Für die Nutzung eines Unternehmenskontos werden\n      Anmelde- und Kontodaten verarbeitet. Angaben aus gespeicherten Übergaben werden dem jeweiligen\n      Unternehmenskonto und der zugehörigen Wohnung zugeordnet.\n    </p>\n<h3>3. Speicherung und Verarbeitung in ÜbergabeCheck Business</h3>\n<p>\n      Während einer laufenden Übergabe kann ein technischer Entwurf vorübergehend im Browser des\n      verwendeten Geräts gespeichert werden. Dauerhaft gespeicherte Objekte, Wohnungen, Übergaben,\n      Mängelangaben, Fotos und Unterschriften werden im Business-Bereich zentral gespeichert und dem\n      jeweiligen Unternehmenskonto zugeordnet. Das Löschen lokaler Browserdaten entfernt daher nicht\n      automatisch bereits zentral gespeicherte Business-Datensätze.\n    </p>\n<h3>4. Authentifizierung und Datenbank mit Supabase</h3>\n<p>\n      Für Registrierung, Anmeldung und die zentrale Speicherung der Business-Daten verwenden wir\n      <strong>Supabase</strong>. Dabei werden insbesondere Kontodaten sowie die vom angemeldeten Unternehmen\n      angelegten Objekte, Wohnungen und Übergabedaten verarbeitet. Der Zugriff auf die Business-Daten\n      erfolgt kontobezogen über die für ÜbergabeCheck eingerichtete Supabase-Infrastruktur.\n    </p>\n'''
          text = text[:start] + privacy + text[end:]
          text = text.replace('<h3>4. Webanalyse mit Umami</h3>', '<h3>5. Webanalyse mit Umami</h3>', 1)
          text = text.replace('<h3>5. Hosting durch STRATO</h3>', '<h3>6. Hosting durch STRATO</h3>', 1)
          text = text.replace('<h3>6. Rechtsgrundlage</h3>', '<h3>7. Rechtsgrundlage</h3>', 1)
          text = text.replace('<h3>7. Deine Rechte</h3>', '<h3>8. Deine Rechte</h3>', 1)
          text = text.replace('<h3>8. Änderungen</h3>', '<h3>9. Änderungen</h3>', 1)
          text, n = re.subn(r'\n<p class="notice">\n\s*Hinweis: Diese Datenschutzerklärung ist eine technische Vorlage.*?</p>', '', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Prototype privacy notice not found')

          # 6 support: hashes from the public Business landing open legal overlays without login
          close_privacy = 'function closeDatenschutz(){document.getElementById("datenschutzOverlay").classList.add("hidden");}\n'
          close_privacy_new = close_privacy + '''document.addEventListener("DOMContentLoaded",()=>{\n  const hash=(window.location.hash||"").toLowerCase();\n  if(hash==="#impressum") openImpressum();\n  else if(hash==="#datenschutz") openDatenschutz();\n});\n'''
          replace_once(close_privacy, close_privacy_new, 'legal hash handler')

          # 11: load transfer data where UI later reads t.data
          old_select = '.select("id,type,status,created_at,apartment_id,apartments(id,name,number,object_id,objects(id,name))")'
          new_select = '.select("id,type,status,created_at,apartment_id,data,apartments(id,name,number,object_id,objects(id,name))")'
          if text.count(old_select) != 1:
              raise SystemExit(f'Expected one transfer overview select, found {text.count(old_select)}')
          text = text.replace(old_select, new_select, 1)
          old_select2 = '.select("id,type,status,created_at,apartment_id,apartments(id,name,object_id,objects(id,name))")'
          new_select2 = '.select("id,type,status,created_at,apartment_id,data,apartments(id,name,object_id,objects(id,name))")'
          if text.count(old_select2) != 1:
              raise SystemExit(f'Expected one dashboard transfer select, found {text.count(old_select2)}')
          text = text.replace(old_select2, new_select2, 1)

          # 10: an existing transfer is opened, not started
          replace_once('\n          Starten\n        </button>', '\n          Öffnen\n        </button>', 'existing transfer button label')

          # 14: remove the earlier duplicate show/hideApartmentForm definitions
          first = text.find('function showApartmentForm(){')
          reset = text.find('async function resetApartmentForm(){', first)
          second = text.find('function showApartmentForm(){', reset)
          if first < 0 or reset < 0 or second < 0:
              raise SystemExit('Duplicate apartment form definitions not found as expected')
          text = text[:first] + text[reset:]

          # 15: bind autosave listeners only once for the persistent form DOM
          autosave_old = '''function addAutosaveListeners(){\n  document.querySelectorAll("input, textarea, select").forEach(el=>{'''
          autosave_new = '''let autosaveListenersBound=false;\nfunction addAutosaveListeners(){\n  if(autosaveListenersBound) return;\n  autosaveListenersBound=true;\n  document.querySelectorAll("input, textarea, select").forEach(el=>{'''
          replace_once(autosave_old, autosave_new, 'autosave listener guard')

          # 16: make global search lookup pure instead of mutating selectedBusinessObjectId
          search_old = '''  if(type==="all"||type==="transfers") Object.entries(apartmentTransfers||{}).forEach(([aid,list])=>{\n    const a=getApartmentById(aid);\n    let object=null;\n    if(a){\n      const objectId=Object.keys(businessApartments||{}).find(oid=>\n        (businessApartments[oid]||[]).some(ap=>String(ap.id)===String(aid))\n      );\n      object=businessObjects.find(x=>String(x.id)===String(objectId));\n    }\n\n    (list||[]).forEach(t=>{'''
          search_new = '''  if(type==="all"||type==="transfers") Object.entries(apartmentTransfers||{}).forEach(([aid,list])=>{\n    const objectId=Object.keys(businessApartments||{}).find(oid=>\n      (businessApartments[oid]||[]).some(ap=>String(ap.id)===String(aid))\n    );\n    const a=objectId\n      ? (businessApartments[objectId]||[]).find(ap=>String(ap.id)===String(aid)) || null\n      : null;\n    const object=objectId\n      ? businessObjects.find(x=>String(x.id)===String(objectId)) || null\n      : null;\n\n    (list||[]).forEach(t=>{'''
          replace_once(search_old, search_new, 'pure transfer search lookup')

          # 12: calculate object-specific transfer and defect counts
          marker = 'function resetObjectForm(){'
          idx = text.find(marker)
          if idx < 0:
              raise SystemExit('resetObjectForm marker not found')
          stat_fn = '''async function updateObjectDetailStats(){\n  if(selectedBusinessObjectId===null || selectedBusinessObjectId===undefined) return;\n\n  const objectId=String(selectedBusinessObjectId);\n  const apartments=businessApartments[selectedBusinessObjectId] || businessApartments[objectId] || [];\n  const transferCount=apartments.reduce((sum,apartment)=>{\n    const rows=apartmentTransfers[apartment.id] || apartmentTransfers[String(apartment.id)] || [];\n    return sum + rows.length;\n  },0);\n\n  const apartmentCount=document.getElementById("objectApartmentCount");\n  const transferEl=document.getElementById("objectTransferCount");\n  const defectEl=document.getElementById("objectOpenDefectCount");\n  if(apartmentCount) apartmentCount.textContent=apartments.length;\n  if(transferEl) transferEl.textContent=transferCount;\n\n  const defects=await loadBusinessDefects(false);\n  const defectCount=defects.filter(d=>String(d.objectId)===objectId).length;\n  if(defectEl) defectEl.textContent=defectCount;\n}\n\n'''
          text = text[:idx] + stat_fn + text[idx:]

          replace_once('function openObject(id){', 'async function openObject(id){', 'async openObject')
          replace_once('  renderApartments();\n  window.scrollTo({top:0,behavior:"smooth"});\n}', '  renderApartments();\n  await updateObjectDetailStats();\n  window.scrollTo({top:0,behavior:"smooth"});\n}', 'object detail stat refresh')

          # Refresh detail stats after mutations when an object is selected.
          replace_once('  renderApartments();\n  updateApartmentCount();\n\n  if(window.editingApartmentId', '  renderApartments();\n  updateApartmentCount();\n  if(selectedBusinessObjectId!==null) await updateObjectDetailStats();\n\n  if(window.editingApartmentId', 'apartment save stat refresh')
          replace_once('  delete apartmentTransfers[id];renderApartments();updateApartmentCount();\n}', '  delete apartmentTransfers[id];renderApartments();updateApartmentCount();\n  if(selectedBusinessObjectId!==null) await updateObjectDetailStats();\n}', 'apartment delete stat refresh')
          replace_once('  updateBusinessStats();\n  startApp();\n}', '  updateBusinessStats();\n  await updateObjectDetailStats();\n  startApp();\n}', 'new transfer stat refresh')
          replace_once('  await renderApartmentTransfers();\n  updateBusinessStats();\n}', '  await renderApartmentTransfers();\n  updateBusinessStats();\n  if(selectedBusinessObjectId!==null) await updateObjectDetailStats();\n}', 'delete transfer stat refresh')
          replace_once('  await updateBusinessStats();\n  await renderBusinessDefects();\n}', '  await updateBusinessStats();\n  await renderBusinessDefects();\n  if(selectedBusinessObjectId!==null) await updateObjectDetailStats();\n}', 'defect edit stat refresh')
          replace_once('  await updateBusinessStats();\n  await renderBusinessDefects();\n  const history=document.getElementById("defectsHistory");', '  await updateBusinessStats();\n  await renderBusinessDefects();\n  if(selectedBusinessObjectId!==null) await updateObjectDetailStats();\n  const history=document.getElementById("defectsHistory");', 'defect resolve stat refresh')

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/business-prelaunch-cleanup.yml').unlink()
          PY

      - name: Commit bundled cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/business-prelaunch-cleanup.yml
          git commit -m "Bundle Business prelaunch cleanup"
          git push origin HEAD:feature/business-prelaunch-cleanup
