name: Remove duplicate registration pricing
on:
  push:
    branches: [feature/remove-duplicate-registration-price]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/remove-duplicate-registration-price
      - name: Remove duplicate price block
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='  .registration-plan{background:#f5f5f6;border:1px solid #e2e3e6;border-radius:14px;padding:14px 15px;margin:-7px 0 18px}\n  .registration-plan strong{display:block;font-size:14px;margin-bottom:4px}\n  .registration-plan span{display:block;color:#666;font-size:12px;line-height:1.5}\n'
          block='<div class="registration-plan"><strong>14 Tage kostenlos testen</strong><span>Danach 29,99 € / Monat · jederzeit kündbar · alle Business-Funktionen inklusive</span></div>\n'
          if block not in s:
              raise SystemExit('Duplicate registration pricing block not found')
          s=s.replace(block,'',1)
          s=s.replace(css,'',1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          test "$(grep -o '14 Tage kostenlos testen' index.html | wc -l)" -eq 1
          ! grep -q 'registration-plan' index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          start=s.rfind('<script>')
          end=s.rfind('</script>')
          if start < 0 or end < start:
              raise SystemExit('script block not found')
          Path('/tmp/app.js').write_text(s[start+8:end])
          PY
          node --check /tmp/app.js
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/remove-duplicate-registration-price.yml
          git add index.html
          git commit -m 'Remove duplicate pricing from registration'
          git push origin feature/remove-duplicate-registration-price
