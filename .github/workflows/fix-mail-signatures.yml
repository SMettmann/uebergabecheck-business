name: Fix mail and signatures
on:
  push:
    branches: [feature/mail-only-signature-fix-v2]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mail-only-signature-fix-v2
      - run: python patch_mail_signature.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          for i,script in enumerate(re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>',html,re.S)):
              Path(f'/tmp/inline-{i}.js').write_text(script,encoding='utf-8')
          PY
          for f in /tmp/inline-*.js; do node --check "$f"; done
          if grep -q 'sendTransferEmail' index.html; then exit 1; fi
          if grep -q 'Direkt versenden' index.html; then exit 1; fi
          grep -q 'storedSignatureDetails' index.html
          grep -q 'storedSignatures' index.html
      - run: |
          rm .github/workflows/fix-mail-signatures.yml patch_mail_signature.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-mail-signatures.yml patch_mail_signature.py
          git commit -m "Use local mail client and persist signatures"
          git push origin HEAD:feature/mail-only-signature-fix-v2
