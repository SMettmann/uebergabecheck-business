name: Name Resend in Business privacy
on:
  push:
    branches: [main]
    paths:
      - '.github/resend-privacy-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/name_resend_contact_privacy.py
      - run: |
          grep -q 'Resend (Plus Five Five, Inc., USA)' index.html
          grep -q 'Stripe, Resend, Umami Cloud' index.html
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/resend-privacy-trigger.txt .github/workflows/name-resend-contact-privacy.yml scripts/name_resend_contact_privacy.py
          git add index.html
          git commit -m 'Name contact email processor in Business privacy'
          git push origin main
