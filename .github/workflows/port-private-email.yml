name: Port private email behavior

on:
  push:
    branches:
      - feature/direct-mail-client-clean

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/direct-mail-client-clean

      - name: Patch frontend
        run: python .github/scripts/port_private_email.py

      - name: Validate JavaScript
        run: |
          for f in /tmp/inline-*.js; do node --check "$f"; done

      - name: Commit and clean up
        run: |
          rm .github/workflows/port-private-email.yml
          rm .github/scripts/port_private_email.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/port-private-email.yml .github/scripts/port_private_email.py
          git commit -m "Port proven private email flow to Business"
          git push origin HEAD:feature/direct-mail-client-clean
