name: Mobile login pricing
on:
  push:
    branches: [feature/mobile-login-pricing]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-login-pricing
      - name: Put pricing before login
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css_anchor='  .login-lead{color:#70727a;font-size:14px;line-height:1.55;margin:0 0 22px}\n'
          css_add=css_anchor+'  .login-pricing-summary{background:#f5f5f6;border:1px solid #e2e3e6;border-radius:16px;padding:16px 17px;margin:0 0 20px}\n  .login-pricing-summary strong{display:block;font-size:16px;margin-bottom:5px}\n  .login-pricing-summary span{display:block;color:#666;font-size:13px;line-height:1.45}\n  .login-customer-title{font-size:19px;margin:0 0 7px}\n'
          if css_anchor not in s:
              raise SystemExit('CSS anchor not found')
          s=s.replace(css_anchor,css_add,1)
          old='''<div class="business-pill">BUSINESS</div>\n<h1>Willkommen zurück.</h1>\n<p class="login-lead">\n        Melde dich an, um deine Objekte, Wohnungen und Übergaben zentral zu verwalten.\n      </p>\n<form onsubmit="businessLogin(event)">'''
          new='''<div class="business-pill">BUSINESS</div>\n<h1>ÜbergabeCheck Business</h1>\n<div class="login-pricing-summary">\n  <strong>14 Tage kostenlos testen</strong>\n  <span>Danach 29,99 € / Monat · jederzeit kündbar</span>\n</div>\n<h2 class="login-customer-title">Bereits Kunde? Einloggen</h2>\n<p class="login-lead">Melde dich an, um deine Objekte, Wohnungen und Übergaben zentral zu verwalten.</p>\n<form onsubmit="businessLogin(event)">'''
          if old not in s:
              raise SystemExit('Login anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q 'Bereits Kunde? Einloggen' index.html
          grep -q '14 Tage kostenlos testen' index.html
          grep -q 'Danach 29,99 € / Monat' index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          start=s.rfind('<script>')
          end=s.rfind('</script>')
          if start < 0 or end < start:
              raise SystemExit('script block not found')
          Path('/tmp/app.js').write_text(s[start+8:end])
          PY
          node --check /tmp/app.js
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mobile-login-pricing.yml
          git add index.html
          git commit -m 'Show pricing before Business login'
          git push origin feature/mobile-login-pricing
