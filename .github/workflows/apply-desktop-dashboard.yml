name: Apply desktop dashboard redesign

on:
  push:
    paths:
      - 'desktop-dashboard.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch app.html desktop dashboard
        run: python tools/apply_desktop_dashboard.py
      - name: Commit redesigned app
        run: |
          git config user.name "ÜbergabeCheck Build"
          git config user.email "actions@users.noreply.github.com"
          git add app.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine Business desktop dashboard in app"
          git push origin main
