name: Direct mail client clean

on:
  push:
    branches:
      - feature/direct-mail-client-clean

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/direct-mail-client-clean

      - name: Patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py

      - name: Validate
        shell: bash
        run: |
          grep -q '✉ Per E-Mail senden' index.html
          grep -q 'mailto:?subject=' index.html
          grep -q 'storedSignatureDetails' index.html
          grep -q 'storedSignatures' index.html
          ! grep -q 'transferEmailOverlay' index.html
          ! grep -q 'openTransferMailClient' index.html
          ! grep -q 'sendTransferEmail' index.html

      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/direct-mail-client-clean.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/direct-mail-client-clean.yml
          git commit -m "Open local mail client directly"
          git push origin HEAD:feature/direct-mail-client-clean
