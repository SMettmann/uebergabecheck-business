name: Install email button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, 'Install email button') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          old = '<button class="secondary" onclick="saveTransferOnly()" type="button">Speichern</button>\n<button class="primary" onclick="saveTransferAndPrint()" type="button">Speichern &amp; drucken</button>'
          new = '<button class="secondary" onclick="saveTransferOnly()" type="button">Speichern</button>\n<button class="secondary" onclick="openTransferEmail()" type="button">✉ Per E-Mail senden</button>\n<button class="primary" onclick="saveTransferAndPrint()" type="button">Speichern &amp; drucken</button>'
          if old not in html:
              raise SystemExit('Could not find protocol action buttons')
          html = html.replace(old, new, 1)

          marker = '<div class="impressum-overlay hidden" id="impressumOverlay"'
          modal = '''<div class="impressum-overlay hidden" id="transferEmailOverlay" onclick="if(event.target===this) closeTransferEmail()">\n  <div class="impressum-modal" style="max-width:560px;">\n    <div class="impressum-head">\n      <div>\n        <h2>Übergabe per E-Mail</h2>\n        <div style="color:#777;font-size:13px;margin-top:4px;">Das Übergabeprotokoll kann an einen Empfänger gesendet werden.</div>\n      </div>\n      <button class="impressum-close" type="button" onclick="closeTransferEmail()">Schließen</button>\n    </div>\n    <label for="transferEmailRecipient">E-Mail-Adresse</label>\n    <input id="transferEmailRecipient" type="email" placeholder="name@beispiel.de" autocomplete="email">\n    <label for="transferEmailSubject">Betreff</label>\n    <input id="transferEmailSubject" type="text" value="ÜbergabeCheck – Übergabeprotokoll">\n    <div class="notice" style="margin-top:14px;">Der E-Mail-Versand ist vorbereitet. Der PDF-Anhang wird aktiviert, sobald die ÜbergabeCheck-Domain bei Resend verifiziert ist.</div>\n    <div class="actions">\n      <button class="secondary" type="button" onclick="closeTransferEmail()">Abbrechen</button>\n      <button class="primary" id="transferEmailSendButton" type="button" onclick="sendTransferEmail()">E-Mail senden</button>\n    </div>\n    <div id="transferEmailError" class="login-error hidden"></div>\n  </div>\n</div>\n\n'''
          if marker not in html:
              raise SystemExit('Could not find modal insertion point')
          html = html.replace(marker, modal + marker, 1)

          marker = 'function showSummary(){'
          funcs = '''async function openTransferEmail(){\n  const address=document.getElementById("address")?.value.trim() || "";\n  const subject=document.getElementById("transferEmailSubject");\n  if(subject) subject.value=address ? `ÜbergabeCheck – Übergabeprotokoll – ${address}` : "ÜbergabeCheck – Übergabeprotokoll";\n  document.getElementById("transferEmailError")?.classList.add("hidden");\n  document.getElementById("transferEmailOverlay")?.classList.remove("hidden");\n  document.getElementById("transferEmailRecipient")?.focus();\n}\n\nfunction closeTransferEmail(){\n  document.getElementById("transferEmailOverlay")?.classList.add("hidden");\n}\n\nasync function sendTransferEmail(){\n  const recipient=document.getElementById("transferEmailRecipient")?.value.trim() || "";\n  const subject=document.getElementById("transferEmailSubject")?.value.trim() || "ÜbergabeCheck – Übergabeprotokoll";\n  const button=document.getElementById("transferEmailSendButton");\n  const error=document.getElementById("transferEmailError");\n  if(!recipient || !recipient.includes("@")){ if(error){error.textContent="Bitte eine gültige E-Mail-Adresse eingeben.";error.classList.remove("hidden");} return; }\n  if(!supabaseClient){ if(error){error.textContent="Der E-Mail-Dienst ist aktuell nicht verfügbar.";error.classList.remove("hidden");} return; }\n  if(button){button.disabled=true;button.textContent="Wird gesendet …";}\n  try{\n    const address=document.getElementById("address")?.value.trim() || "";\n    const summaryText=document.getElementById("summary")?.innerText?.trim() || "";\n    const message=["Hallo,","","hier kommt die Übergabedokumentation von ÜbergabeCheck.",address?"Objekt/Wohnung: "+address:"","",summaryText,"","Viele Grüße","ÜbergabeCheck Business"].filter(Boolean).join("\\n");\n    const {data,error:invokeError}=await supabaseClient.functions.invoke("send-transfer-email",{body:{to:recipient,subject,message}});\n    if(invokeError) throw invokeError;\n    if(data?.error) throw new Error(data.error);\n    closeTransferEmail();\n    alert("E-Mail wurde versendet.");\n  }catch(err){\n    console.error("E-Mail-Versand:",err);\n    if(error){error.textContent="Die E-Mail konnte noch nicht versendet werden. Bitte prüfe die Resend-Domain.";error.classList.remove("hidden");}\n  }finally{\n    if(button){button.disabled=false;button.textContent="E-Mail senden";}\n  }\n}\n\n'''
          if marker not in html:
              raise SystemExit('Could not find JavaScript insertion point')
          html = html.replace(marker, funcs + marker, 1)
          p.write_text(html, encoding='utf-8')
          PY

      - name: Commit and remove installer
        run: |
          rm -f .github/workflows/apply-email-button.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-email-button.yml
          git commit -m "Install email button"
          git push
