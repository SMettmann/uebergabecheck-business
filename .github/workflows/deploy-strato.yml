name: Deploy Business to STRATO

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strato-business-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate deploy files
        run: |
          test -s index.html
          test -s app.html
          test -s business-tools.js
          test -s pdf-export.js

      - name: Install SFTP client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Upload Business files to STRATO
        env:
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_USER: ${{ secrets.STRATO_USER }}
          STRATO_PASSWORD: ${{ secrets.STRATO_PASSWORD }}
        run: |
          lftp <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set sftp:auto-confirm yes
          open -u "$STRATO_USER","$STRATO_PASSWORD" sftp://$STRATO_HOST:22
          mirror -R --verbose --parallel=2 \
            --exclude-glob .git \
            --exclude-glob .git/** \
            --exclude-glob .github \
            --exclude-glob .github/** \
            --exclude-glob tools \
            --exclude-glob tools/** \
            ./ ./
          bye
          EOF

      - name: Deployment finished
        run: echo "ÜbergabeCheck Business wurde erfolgreich zu STRATO übertragen."
