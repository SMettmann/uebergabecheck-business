name: Build integrated Business app

on:
  push:
    branches: [main]
    paths:
      - index.html
      - team.html
      - tools/build_integrated_app.py
      - tools/patch_team_session.py
      - .github/workflows/build-integrated-app.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build complete app.html
        run: python tools/build_integrated_app.py

      - name: Patch team session handling
        run: python tools/patch_team_session.py

      - name: Validate generated files
        run: |
          test -s app.html
          test -s team.html
          grep -q "UEBERGABECHECK_ROLE_GUARDS_START" app.html
          grep -q "resetRoleState" app.html
          grep -q "Keine Berechtigung" app.html
          grep -q "businessTeamButton" app.html
          grep -q 'BUSINESS_TERMS_VERSION="2026-08-27-2"' app.html
          grep -q 'BUSINESS_AVV_VERSION="2026-08-27-2"' app.html
          grep -q "bis zu 10 zusätzliche Mitarbeiterzugänge" app.html
          grep -q "handleMissingBusinessLegalAcceptance" app.html
          grep -q "müssen zuerst vom Inhaber" app.html
          grep -q "revalidateTeamSession" team.html
          grep -q "onAuthStateChange" team.html

      - name: Commit generated files
        run: |
          if git diff --quiet -- app.html team.html; then
            echo "Generated files already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html team.html
          git commit -m "Build Business app with owner legal gate"
          git push

