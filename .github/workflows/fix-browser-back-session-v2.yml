name: Fix browser back session v2
on:
  push:
    branches: [feature/browser-back-session-fix-v2]
permissions:
  contents: write
jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/browser-back-session-fix-v2
      - name: Make pageshow session restore unconditional
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''window.addEventListener("pageshow", (event) => {\n  if(event.persisted){\n    restoreSupabaseSession();\n  }\n});'''
          new='''window.addEventListener("pageshow", () => {\n  restoreSupabaseSession();\n});'''
          if old not in s:
              raise SystemExit('Expected pageshow block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/inline.js
      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/fix-browser-back-session-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-browser-back-session-v2.yml
          git commit -m "Recheck Business session on every page restore"
          git push origin HEAD:feature/browser-back-session-fix-v2
