name: Apply email preparation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply email preparation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          old = '''<button class="secondary" onclick="saveTransferOnly()" type="button">Speichern</button>\n<button class="primary" onclick="saveTransferAndPrint()" type="button">Speichern &amp; drucken</button>'''
          new = '''<button class="secondary" onclick="saveTransferOnly()" type="button">Speichern</button>\n<button class="secondary" onclick="openTransferEmail()" type="button">Per E-Mail senden</button>\n<button class="primary" onclick="saveTransferAndPrint()" type="button">Speichern &amp; drucken</button>'''
          if old not in html:
              raise SystemExit('Protocol action block not found')
          html = html.replace(old, new, 1)

          marker = '<div class="impressum-overlay hidden" id="impressumOverlay"'
          modal = '''<div class="impressum-overlay hidden" id="transferEmailOverlay" onclick="if(event.target===this) closeTransferEmail()">\n  <div class="impressum-modal" style="max-width:560px;">\n    <div class="impressum-head">\n      <div>\n        <h2 id="transferEmailTitle">Übergabe per E-Mail</h2>\n        <div style="color:#777;font-size:13px;margin-top:4px;">Das fertige Übergabeprotokoll wird an den Empfänger gesendet.</div>\n      </div>\n      <button class="impressum-close" type="button" onclick="closeTransferEmail()">Schließen</button>\n    </div>\n    <label for="transferEmailRecipient">E-Mail-Adresse</label>\n    <input id="transferEmailRecipient" type="email" placeholder="name@beispiel.de" autocomplete="email">\n    <label for="transferEmailSubject">Betreff</label>\n    <input id="transferEmailSubject" type="text" value="ÜbergabeCheck – Übergabeprotokoll">\n    <div class="notice" style="margin-top:14px;">\n      <strong>Hinweis:</strong> Der E-Mail-Versand ist bereits vorbereitet. Der PDF-Anhang wird im nächsten Schritt mit der eigenen ÜbergabeCheck-Domain aktiviert.\n    </div>\n    <div class="actions">\n      <button class="secondary" type="button" onclick="closeTransferEmail()">Abbrechen</button>\n      <button class="primary" id="transferEmailSendButton" type="button" onclick="sendTransferEmail()">E-Mail senden</button>\n    </div>\n    <div id="transferEmailError" class="login-error hidden"></div>\n  </div>\n</div>\n\n'''
          if marker not in html:
              raise SystemExit('Impressum marker not found')
          html = html.replace(marker, modal + marker, 1)

          marker = 'function showSummary(){'
          funcs = r'''function openTransferEmail(){
  const address=document.getElementById("address")?.value.trim() || "";
  const subject=document.getElementById("transferEmailSubject");
  if(subject) subject.value=address ? `ÜbergabeCheck – Übergabeprotokoll – ${address}` : "ÜbergabeCheck – Übergabeprotokoll";
  const error=document.getElementById("transferEmailError");
  if(error){ error.textContent=""; error.classList.add("hidden"); }
  document.getElementById("transferEmailOverlay")?.classList.remove("hidden");
  document.getElementById("transferEmailRecipient")?.focus();
}

function closeTransferEmail(){
  document.getElementById("transferEmailOverlay")?.classList.add("hidden");
}

async function sendTransferEmail(){
  const recipient=document.getElementById("transferEmailRecipient")?.value.trim() || "";
  const subject=document.getElementById("transferEmailSubject")?.value.trim() || "ÜbergabeCheck – Übergabeprotokoll";
  const button=document.getElementById("transferEmailSendButton");
  const error=document.getElementById("transferEmailError");

  if(!recipient || !recipient.includes("@")){
    if(error){ error.textContent="Bitte eine gültige E-Mail-Adresse eingeben."; error.classList.remove("hidden"); }
    return;
  }
  if(!supabaseClient){
    if(error){ error.textContent="Der E-Mail-Dienst ist aktuell nicht verfügbar."; error.classList.remove("hidden"); }
    return;
  }

  if(button){ button.disabled=true; button.textContent="Wird gesendet …"; }
  if(error){ error.textContent=""; error.classList.add("hidden"); }

  try{
    const summaryText=document.getElementById("summary")?.innerText?.trim() || "";
    const address=document.getElementById("address")?.value.trim() || "";
    const tenantSurname=document.getElementById("tenantSurname")?.value.trim() || "";
    const message=[
      "Hallo,",
      "",
      "hier kommt die Übergabedokumentation von ÜbergabeCheck.",
      "",
      address ? "Objekt/Wohnung: "+address : "",
      tenantSurname ? "Mieter: "+tenantSurname : "",
      "",
      summaryText,
      "",
      "Viele Grüße",
      "ÜbergabeCheck Business"
    ].filter(Boolean).join("\\n");

    const {data,error:invokeError}=await supabaseClient.functions.invoke("send-transfer-email",{body:{to:recipient,subject,message}});
    if(invokeError) throw invokeError;
    if(data?.error) throw new Error(data.error);

    closeTransferEmail();
    alert("E-Mail wurde versendet.");
  }catch(err){
    console.error("E-Mail-Versand:",err);
    if(error){ error.textContent="Die E-Mail konnte noch nicht versendet werden. Bitte prüfe den E-Mail-Dienst und die hinterlegte Domain."; error.classList.remove("hidden"); }
  }finally{
    if(button){ button.disabled=false; button.textContent="E-Mail senden"; }
  }
}

'''
          if marker not in html:
              raise SystemExit('showSummary marker not found')
          html = html.replace(marker, funcs + marker, 1)

          p.write_text(html, encoding='utf-8')
          PY

      - name: Commit patch and remove one-time workflow
        run: |
          rm -f .github/workflows/apply-email-prep.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-email-prep.yml
          git commit -m "Apply email preparation"
          git push
