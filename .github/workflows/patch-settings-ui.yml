name: Patch Business settings loader

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-settings-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Load settings module from Business tools
        run: |
          python -c "from pathlib import Path; p=Path('business-tools.js'); t=p.read_text(encoding='utf-8'); m='UEBERGABECHECK_SETTINGS_LOADER_V1'; s='\n/* '+m+' */\n(function(){if(document.querySelector(\"script[data-uc-business-settings]\"))return;const e=document.createElement(\"script\");e.src=\"business-settings.js?v=1\";e.async=false;e.dataset.ucBusinessSettings=\"1\";document.head.appendChild(e);})();\n'; p.write_text(t if m in t else t+s,encoding='utf-8')"

      - name: Validate loader
        run: |
          grep -q 'UEBERGABECHECK_SETTINGS_LOADER_V1' business-tools.js
          test -s business-settings.js

      - name: Commit source change
        run: |
          if git diff --quiet -- business-tools.js; then
            echo "No source change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business-tools.js
          git commit -m "Load Business settings module"
          git push origin main

      - name: Install SFTP client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Deploy settings module to STRATO
        env:
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_USER: ${{ secrets.STRATO_USER }}
          STRATO_PASSWORD: ${{ secrets.STRATO_PASSWORD }}
        run: |
          lftp <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set sftp:auto-confirm yes
          open -u "$STRATO_USER","$STRATO_PASSWORD" sftp://$STRATO_HOST:22
          put business-tools.js -o business-tools.js
          put business-settings.js -o business-settings.js
          bye
          EOF
