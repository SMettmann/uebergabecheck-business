name: Patch primary mail client

on:
  push:
    branches:
      - feature/mail-client-primary
    paths:
      - .github/workflows/patch-primary-mail-client.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mail-client-primary

      - name: Patch index.html
        run: python .github/scripts/patch_mail_client.py

      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>',html,re.S)
          for i,script in enumerate(scripts):
              Path(f'/tmp/inline-{i}.js').write_text(script,encoding='utf-8')
          print(f'Found {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-*.js; do node --check "$f"; done
          grep -q 'onclick="openTransferMailClient()"' index.html
          grep -q 'Direkt versenden' index.html
          grep -q 'Im E-Mail-Programm öffnen' index.html

      - name: Commit patch and remove temporary files
        run: |
          rm .github/workflows/patch-primary-mail-client.yml
          rm .github/scripts/patch_mail_client.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-primary-mail-client.yml .github/scripts/patch_mail_client.py
          git commit -m "Make local mail client the primary email option"
          git push origin HEAD:feature/mail-client-primary
