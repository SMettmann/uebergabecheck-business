name: Apply owner legal gate UI

on:
  push:
    branches: [main]
    paths:
      - tools/patch_owner_legal_gate.py
      - .github/workflows/patch-owner-legal-gate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch legal gate
        run: python tools/patch_owner_legal_gate.py
      - name: Validate
        run: |
          grep -q "handleMissingBusinessLegalAcceptance" index.html
          grep -q "müssen zuerst vom Inhaber" index.html
      - name: Commit source
        run: |
          if git diff --quiet -- index.html; then
            echo "Owner legal gate already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show legal acceptance only to company owner"
          git push
