name: Fix browser back history
on:
  push:
    branches: [feature/browser-back-history-fix]
jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/browser-back-history-fix
      - name: Add internal history handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          anchor='''window.addEventListener("pageshow", () => {\n  restoreSupabaseSession();\n});\n\n'''
          addition='''window.addEventListener("pageshow", () => {\n  restoreSupabaseSession();\n});\n\nfunction markBusinessDashboardHistory(){\n  if(history.state?.uebergabeCheckTransfer){\n    const nextState={...(history.state||{})};\n    delete nextState.uebergabeCheckTransfer;\n    history.replaceState(nextState,"",location.href);\n  }\n}\n\nfunction pushTransferHistoryEntry(){\n  if(!supabaseUser || history.state?.uebergabeCheckTransfer) return;\n  history.pushState({...(history.state||{}),uebergabeCheckTransfer:true},"",location.href);\n}\n\nwindow.addEventListener("popstate", async () => {\n  if(!supabaseUser) await restoreSupabaseSession();\n  if(supabaseUser) showBusinessDashboard(supabaseUser);\n});\n\n'''
          if anchor not in s:
              raise SystemExit('pageshow anchor not found')
          s=s.replace(anchor,addition,1)
          dashboard='''function showBusinessDashboard(user=null){\n  const landing=document.getElementById("landing");'''
          dashboard_new='''function showBusinessDashboard(user=null){\n  markBusinessDashboardHistory();\n  const landing=document.getElementById("landing");'''
          if dashboard not in s:
              raise SystemExit('dashboard anchor not found')
          s=s.replace(dashboard,dashboard_new,1)
          start='''function startApp(){\n  const landing=document.getElementById("landing");'''
          start_new='''function startApp(){\n  pushTransferHistoryEntry();\n  const landing=document.getElementById("landing");'''
          if start not in s:
              raise SystemExit('startApp anchor not found')
          s=s.replace(start,start_new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Check inline JavaScript syntax
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          for(const js of scripts){ new Function(js); }
          console.log('Inline JS syntax OK');
          NODE
      - name: Verify history hooks
        run: |
          grep -q 'function pushTransferHistoryEntry' index.html
          grep -q 'window.addEventListener("popstate"' index.html
          grep -q 'pushTransferHistoryEntry();' index.html
          grep -q 'markBusinessDashboardHistory();' index.html
      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/fix-browser-back-history.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-browser-back-history.yml
          git commit -m "Keep browser back inside Business dashboard"
          git push origin HEAD:feature/browser-back-history-fix
