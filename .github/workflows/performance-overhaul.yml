name: Business performance overhaul

on:
  push:
    branches:
      - feature/performance-overhaul

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/performance-overhaul

      - name: Preserve JavaScript escapes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/performance_patch.py')
          s=p.read_text(encoding='utf-8')
          p.write_text(s.replace(", '''", ", r'''"),encoding='utf-8')
          PY

      - name: Apply performance patch
        run: python scripts/performance_patch.py

      - name: Validate optimized Business app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>',html,re.S)
          for i,script in enumerate(scripts):
              Path(f'/tmp/inline-{i}.js').write_text(script,encoding='utf-8')
          PY
          for f in /tmp/inline-*.js; do node --check "$f"; done
          grep -q 'open_defect_count' index.html
          grep -q 'defects_summary' index.html
          grep -q 'compressImageDataURL' index.html
          grep -q 'Daten werden geladen' index.html
          if grep -q 'select("id,apartment_id,type,status,created_at,data")' index.html; then exit 1; fi

      - name: Commit optimized app and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/performance-overhaul.yml scripts/performance_patch.py
          rmdir scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/performance-overhaul.yml scripts/performance_patch.py
          git commit -m "Optimize Business loading and transfer payloads"
          git push origin HEAD:feature/performance-overhaul
