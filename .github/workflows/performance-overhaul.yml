          between('async function loadBusinessData(user){','function hideAuthAuxForms(){',r'''async function loadBusinessData(user){
  if(!user||!supabaseClient) return;
  if(businessDataLoadedForUser===user.id){
    renderBusinessObjects();
    updateBusinessStats();
    return;
  }
  if(businessDataLoading) return;
  businessDataLoading=true;
  try{
    const companyId=await ensureBusinessCompany(user);
    const {data:objects,error:objectError}=await supabaseClient.from("objects")
      .select("id,company_id,name,street,zip,city,note,created_at")
      .eq("company_id",companyId).order("created_at",{ascending:true});
    if(objectError) throw objectError;
    businessObjects=objects||[];
    businessApartments={}; apartmentTransfers={};

    const objectIds=businessObjects.map(o=>o.id);
    if(objectIds.length){
      const {data:apartments,error:apartmentError}=await supabaseClient.from("apartments")
        .select("id,object_id,name,number,rooms,area,note,created_at")
        .in("object_id",objectIds).order("created_at",{ascending:true});
      if(apartmentError) throw apartmentError;
      (apartments||[]).forEach(a=>{
        if(!businessApartments[a.object_id]) businessApartments[a.object_id]=[];
