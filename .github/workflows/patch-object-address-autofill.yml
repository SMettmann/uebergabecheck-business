name: Patch object address autofill

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-object-address-autofill.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Business address autofill
        run: python3 tools/patch_object_address_autofill.py

      - name: Commit source change
        run: |
          if git diff --quiet -- business-tools.js; then
            echo "No source change required."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add business-tools.js
            git commit -m "Autofill object address for new transfers"
            git push origin main
          fi

      - name: Install SFTP client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Deploy Business tools to STRATO
        env:
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_USER: ${{ secrets.STRATO_USER }}
          STRATO_PASSWORD: ${{ secrets.STRATO_PASSWORD }}
        run: |
          lftp <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set sftp:auto-confirm yes
          open -u "$STRATO_USER","$STRATO_PASSWORD" sftp://$STRATO_HOST:22
          put business-tools.js -o business-tools.js
          bye
          EOF
