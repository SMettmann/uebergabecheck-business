name: Cancellation end-date UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch active subscription notice
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''  } else if(state.effectiveStatus==="active") {\n    notice.classList.add("active");\n    title.textContent="ÜbergabeCheck Business aktiv";\n    const end=businessSubscription?.current_period_end?new Date(businessSubscription.current_period_end).toLocaleDateString("de-DE"):"";\n    text.textContent=end?`Aktiver Tarif · aktueller Zeitraum bis ${end}`:"Aktiver Tarif · 29,99 € / Monat";\n    pill.textContent="AKTIV";\n    action.textContent="Abo verwalten";\n    action.onclick=openStripeCustomerPortal;\n    action.classList.remove("hidden");\n'''
          new='''  } else if(state.effectiveStatus==="active") {\n    notice.classList.add("active");\n    const end=businessSubscription?.current_period_end?new Date(businessSubscription.current_period_end).toLocaleDateString("de-DE"):"";\n    const isCancelled=!!businessSubscription?.cancel_at_period_end;\n    if(isCancelled){\n      title.textContent="Abo gekündigt – Zugang bleibt aktiv";\n      text.textContent=end?`Gekündigt zum ${end} · bis dahin kannst du ÜbergabeCheck Business vollständig nutzen.`:"Gekündigt · Zugang bleibt bis zum Ende des bezahlten Zeitraums aktiv.";\n      pill.textContent="GEKÜNDIGT";\n    }else{\n      title.textContent="ÜbergabeCheck Business aktiv";\n      text.textContent=end?`Aktiver Tarif · aktueller Zeitraum bis ${end}`:"Aktiver Tarif · 29,99 € / Monat";\n      pill.textContent="AKTIV";\n    }\n    action.textContent="Abo verwalten";\n    action.onclick=openStripeCustomerPortal;\n    action.classList.remove("hidden");\n'''
          if old not in s:
              raise SystemExit('active subscription block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q 'Abo gekündigt – Zugang bleibt aktiv' index.html
          grep -q 'Gekündigt zum' index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          start=s.rfind('<script>')
          end=s.rfind('</script>')
          if start < 0 or end < start: raise SystemExit('script block not found')
          Path('/tmp/app.js').write_text(s[start+8:end])
          PY
          node --check /tmp/app.js
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/cancel-end-date-ui.yml
          git add index.html
          git commit -m 'Show subscription cancellation end date'
          git push origin main
