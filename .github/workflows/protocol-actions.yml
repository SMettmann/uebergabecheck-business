name: Improve protocol actions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Improve protocol actions') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch protocol actions
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          # Client-side PDF export library.
          cdn = '<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>'
          if cdn not in html:
              html = html.replace('</head>', cdn + '\n</head>', 1)

          old_actions = '''<div id="summary"></div>\n<div class="actions no-print">\n<button class="secondary" onclick="go(4)" type="button">Zurück</button>\n<button class="secondary" onclick="saveTransferOnly()" type="button">Speichern</button>\n<button class="secondary" onclick="openTransferEmail()" type="button">✉ Per E-Mail senden</button>\n<button class="primary" onclick="saveTransferAndPrint()" type="button">Speichern &amp; drucken</button>\n</div>'''

          new_actions = '''<div id="summary"></div>\n<div class="actions no-print" style="justify-content:flex-end;flex-wrap:wrap;">\n<button class="secondary" onclick="go(4)" type="button">Zurück</button>\n<button class="secondary" onclick="saveTransferOnly()" type="button">Übergabe speichern</button>\n<button class="secondary" onclick="openTransferEmail()" type="button">✉ Per E-Mail senden</button>\n<button class="secondary" onclick="saveTransferPdf()" type="button">PDF speichern</button>\n<button class="primary" onclick="printTransfer()" type="button">Drucken</button>\n</div>'''

          if old_actions in html:
              html = html.replace(old_actions, new_actions, 1)
          elif 'onclick="saveTransferAndPrint()"' in html:
              html = html.replace('<button class="primary" onclick="saveTransferAndPrint()" type="button">Speichern &amp; drucken</button>', '<button class="secondary" onclick="saveTransferPdf()" type="button">PDF speichern</button>\n<button class="primary" onclick="printTransfer()" type="button">Drucken</button>', 1)
              html = html.replace('<button class="secondary" onclick="saveTransferOnly()" type="button">Speichern</button>', '<button class="secondary" onclick="saveTransferOnly()" type="button">Übergabe speichern</button>', 1)
          else:
              raise SystemExit('Protocol action buttons not found')

          marker = 'async function saveTransferAndPrint(){'
          if marker in html:
              start = html.index(marker)
              end = html.index('\n}\n\nasync function openTransferEmail()', start) + 2
              replacement = '''async function saveTransferPdf(){\n  const ok=await persistCurrentTransfer();\n  if(!ok) return;\n\n  if(typeof html2pdf === "undefined"){\n    alert("PDF-Speicherung ist gerade nicht verfügbar. Bitte Seite neu laden.");\n    return;\n  }\n\n  const protocol=document.querySelector(".protocol");\n  if(!protocol) return;\n\n  const clone=protocol.cloneNode(true);\n  clone.querySelectorAll(".no-print").forEach(el=>el.remove());\n  clone.style.width="794px";\n  clone.style.background="#fff";\n  clone.style.padding="0";\n  clone.style.margin="0";\n\n  const holder=document.createElement("div");\n  holder.style.position="fixed";\n  holder.style.left="-100000px";\n  holder.style.top="0";\n  holder.style.width="794px";\n  holder.style.background="#fff";\n  holder.appendChild(clone);\n  document.body.appendChild(holder);\n\n  const address=(document.getElementById("address")?.value || "").trim();\n  const safeName=(address || "Uebergabeprotokoll").replace(/[^a-zA-Z0-9äöüÄÖÜß_-]+/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"");\n\n  try{\n    await html2pdf().set({\n      margin:[10,10,10,10],\n      filename:`UebergabeCheck-${safeName || "Uebergabeprotokoll"}.pdf`,\n      image:{type:"jpeg",quality:0.95},\n      html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff"},\n      jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},\n      pagebreak:{mode:["css","legacy"]}\n    }).from(clone).save();\n  }finally{\n    holder.remove();\n  }\n}\n\nasync function printTransfer(){\n  const ok=await persistCurrentTransfer();\n  if(!ok) return;\n\n  const oldTitle=document.title;\n  document.title="Übergabeprotokoll – Wohnungsübergabe";\n  window.onafterprint=()=>{\n    document.title=oldTitle;\n    window.onafterprint=null;\n  };\n  setTimeout(()=>window.print(),150);\n}'''
              html = html[:start] + replacement + html[end:]
          else:
              # Insert functions before the email function if the old combined function is already gone.
              marker2 = 'async function openTransferEmail(){'
              if marker2 not in html:
                  raise SystemExit('Email function insertion point not found')
              funcs = '''async function saveTransferPdf(){\n  const ok=await persistCurrentTransfer();\n  if(!ok) return;\n  if(typeof html2pdf === "undefined"){ alert("PDF-Speicherung ist gerade nicht verfügbar. Bitte Seite neu laden."); return; }\n  const protocol=document.querySelector(".protocol");\n  if(!protocol) return;\n  const clone=protocol.cloneNode(true);\n  clone.querySelectorAll(".no-print").forEach(el=>el.remove());\n  clone.style.width="794px"; clone.style.background="#fff"; clone.style.padding="0"; clone.style.margin="0";\n  const holder=document.createElement("div"); holder.style.position="fixed"; holder.style.left="-100000px"; holder.style.top="0"; holder.style.width="794px"; holder.style.background="#fff"; holder.appendChild(clone); document.body.appendChild(holder);\n  const address=(document.getElementById("address")?.value || "").trim();\n  const safeName=(address || "Uebergabeprotokoll").replace(/[^a-zA-Z0-9äöüÄÖÜß_-]+/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"");\n  try{ await html2pdf().set({margin:[10,10,10,10],filename:`UebergabeCheck-${safeName || "Uebergabeprotokoll"}.pdf`,image:{type:"jpeg",quality:0.95},html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff"},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:["css","legacy"]}}).from(clone).save(); } finally { holder.remove(); }\n}\n\nasync function printTransfer(){\n  const ok=await persistCurrentTransfer();\n  if(!ok) return;\n  const oldTitle=document.title;\n  document.title="Übergabeprotokoll – Wohnungsübergabe";\n  window.onafterprint=()=>{ document.title=oldTitle; window.onafterprint=null; };\n  setTimeout(()=>window.print(),150);\n}\n\n'''
              html = html.replace(marker2, funcs + marker2, 1)

          p.write_text(html, encoding='utf-8')
          PY

      - name: Commit and remove installer
        run: |
          rm -f .github/workflows/protocol-actions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/protocol-actions.yml
          git commit -m "Improve protocol actions"
          git push
