name: Finalize email and signature persistence

on:
  push:
    branches:
      - feature/email-signature-final
    paths:
      - .github/workflows/finalize-email-signature.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/email-signature-final

      - name: Patch index
        run: python .github/scripts/finalize_email_signature.py

      - name: Check JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>',html,re.S)
          for i,script in enumerate(scripts):
              Path(f'/tmp/inline-{i}.js').write_text(script,encoding='utf-8')
          PY
          for f in /tmp/inline-*.js; do node --check "$f"; done

      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/finalize-email-signature.yml
          rm .github/scripts/finalize_email_signature.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/finalize-email-signature.yml .github/scripts/finalize_email_signature.py
          git commit -m "Use local mail client and persist signatures"
          git push origin HEAD:feature/email-signature-final
