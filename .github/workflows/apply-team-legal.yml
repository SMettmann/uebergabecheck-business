name: Apply Business team tariff legal update

on:
  push:
    branches: [main]
    paths:
      - tools/apply_team_legal.py
      - .github/workflows/apply-team-legal.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply legal and tariff update
        run: python tools/apply_team_legal.py

      - name: Validate update
        run: |
          grep -q 'BUSINESS_TERMS_VERSION="2026-08-27-2"' index.html
          grep -q 'BUSINESS_AVV_VERSION="2026-08-27-2"' index.html
          grep -q 'bis zu 10 zusätzliche Mitarbeiterzugänge' index.html
          grep -q 'persönliche Benutzerkonten' index.html

      - name: Commit source update
        run: |
          if git diff --quiet -- index.html; then
            echo "Legal update already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update Business tariff and legal terms for team accounts"
          git push
