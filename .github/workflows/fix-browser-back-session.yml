name: Fix browser back session

on:
  push:
    branches:
      - feature/browser-back-session-fix

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/browser-back-session-fix

      - name: Add bfcache session restore
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''document.addEventListener("DOMContentLoaded", () => {
            restoreSupabaseSession();
          });'''
          new = '''document.addEventListener("DOMContentLoaded", () => {
            restoreSupabaseSession();
          });

          window.addEventListener("pageshow", (event) => {
            if(event.persisted){
              restoreSupabaseSession();
            }
          });'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected session restore block once, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          scripts = []
          for attrs, body in re.findall(r'<script([^>]*)>(.*?)</script>', s, re.S | re.I):
              if 'src=' not in attrs.lower():
                  scripts.append(body)
          Path('/tmp/business-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/business-inline.js

      - name: Commit fix and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-browser-back-session.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-browser-back-session.yml
          git commit -m "Restore Business session after browser back"
          git push origin HEAD:feature/browser-back-session-fix
