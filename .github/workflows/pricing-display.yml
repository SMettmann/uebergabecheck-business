name: Pricing display
on:
  push:
    branches: [feature/pricing-display]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pricing-display
      - name: Add registration pricing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css_anchor='  .register-link{display:inline-block;margin-top:13px;color:#222;text-decoration:underline;font-weight:750;cursor:pointer}\n'
          css=css_anchor+'  .registration-plan{background:#f5f5f6;border:1px solid #e2e3e6;border-radius:14px;padding:14px 15px;margin:-7px 0 18px}\n  .registration-plan strong{display:block;font-size:14px;margin-bottom:4px}\n  .registration-plan span{display:block;color:#666;font-size:12px;line-height:1.5}\n'
          if css_anchor not in s:
              raise SystemExit('CSS anchor not found')
          s=s.replace(css_anchor,css,1)
          old='<p class="login-lead">Lege den Zugang für deine Hausverwaltung oder dein Unternehmen an.</p>\n<form onsubmit="businessRegister(event)">'
          new='<p class="login-lead">Lege den Zugang für deine Hausverwaltung oder dein Unternehmen an.</p>\n<div class="registration-plan"><strong>14 Tage kostenlos testen</strong><span>Danach 29,99 € / Monat · jederzeit kündbar · alle Business-Funktionen inklusive</span></div>\n<form onsubmit="businessRegister(event)">'
          if old not in s:
              raise SystemExit('Registration anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q '14 Tage kostenlos testen' index.html
          grep -q '29,99 € / Monat' index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          start=s.rfind('<script>')
          end=s.rfind('</script>')
          if start < 0 or end < start:
              raise SystemExit('script block not found')
          Path('/tmp/app.js').write_text(s[start+8:end])
          PY
          node --check /tmp/app.js
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pricing-display.yml
          git add index.html
          git commit -m 'Show plan price during Business registration'
          git push origin feature/pricing-display
