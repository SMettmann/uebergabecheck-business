<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · ÜbergabeCheck Business</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f5f7;color:#17181b}.wrap{max-width:1240px;margin:auto;padding:26px 20px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.brand{font-size:21px;font-weight:850}.brand span{font-weight:500;color:#777}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 13px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.primary{background:#111;color:#fff}.secondary{background:#fff;color:#333;border:1px solid #ddd}.hero{background:#111;color:#fff;border-radius:22px;padding:28px;margin-bottom:14px;display:flex;justify-content:space-between;gap:20px;align-items:flex-end}.kicker{font-size:10px;font-weight:850;letter-spacing:1.6px;color:#aaa;text-transform:uppercase;margin-bottom:7px}.hero h1{margin:0 0 6px;font-size:32px;letter-spacing:-1px}.hero p{margin:0;color:#c8c8c8;font-size:13px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.kpi{background:#fff;border:1px solid #e1e2e5;border-radius:16px;padding:16px}.kpi span{display:block;font-size:11px;color:#777;margin-bottom:7px}.kpi strong{font-size:26px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#fff;border:1px solid #e1e2e5;border-radius:16px;padding:10px;margin-bottom:14px}.filters{display:flex;gap:6px;flex-wrap:wrap}.filter{border:0;background:#f1f2f4;color:#555;border-radius:9px;padding:8px 11px;font:inherit;font-size:11px;font-weight:850;cursor:pointer}.filter.active{background:#111;color:#fff}.search{width:min(320px,100%);padding:9px 11px;border:1px solid #ddd;border-radius:10px;font:inherit;font-size:12px}.card{background:#fff;border:1px solid #e1e2e5;border-radius:18px;padding:16px;box-shadow:0 3px 14px rgba(0,0,0,.025)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1080px}.table th,.table td{text-align:left;padding:11px 9px;border-bottom:1px solid #eee;vertical-align:top}.table th{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.05em}.table td{font-size:12px}.table tr:last-child td{border-bottom:0}.company strong,.subject strong{display:block;margin-bottom:3px}.company small,.subject small{color:#888}.details{max-width:330px;white-space:pre-wrap;line-height:1.45;color:#555}.pill{display:inline-block;font-size:10px;font-weight:850;padding:6px 8px;border-radius:999px;background:#f0f1f3;white-space:nowrap}.pill.error{background:#ffe9e9;color:#8f3333}.pill.idea{background:#eef0ff;color:#4e5496}.pill.work{background:#fff4d9;color:#7c5b13}.pill.done{background:#e9f5ec;color:#27683b}.status-select{min-width:135px;border:1px solid #d8d9dd;background:#fff;border-radius:9px;padding:8px;font:inherit;font-size:11px}.reply{width:220px;min-height:68px;border:1px solid #d8d9dd;border-radius:9px;padding:8px;font:inherit;font-size:11px;resize:vertical}.row-actions{display:flex;gap:6px;flex-direction:column;min-width:105px}.row-actions button{border:0;border-radius:8px;padding:8px 9px;font:inherit;font-size:10px;font-weight:850;cursor:pointer}.save{background:#111;color:#fff}.archive{background:#ececef;color:#333}.restore{background:#e9f5ec;color:#27683b}.empty{padding:30px;text-align:center;color:#777;font-size:13px}.denied{max-width:560px;margin:70px auto;background:#fff;border:1px solid #ddd;border-radius:20px;padding:28px;text-align:center}.denied h2{margin-top:0}.hidden{display:none!important}@media(max-width:800px){.wrap{padding:18px 12px 45px}.top,.hero,.toolbar{align-items:stretch;flex-direction:column}.kpis{grid-template-columns:1fr 1fr}.search{width:100%}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap" id="adminApp">
  <div class="top"><div class="brand">Übergabe<span>Check</span> · Admin</div><div class="actions"><button class="btn secondary" onclick="location.href='app.html'">← Business</button><button class="btn secondary" id="refresh">↻ Aktualisieren</button></div></div>
  <section class="hero"><div><div class="kicker">INTERN</div><h1>Support & Verbesserungen</h1><p>Alle Anfragen aus ÜbergabeCheck Business an einer Stelle.</p></div><div style="font-size:12px;color:#aaa" id="adminIdentity"></div></section>
  <div class="kpis"><div class="kpi"><span>Offen</span><strong id="kpiOpen">–</strong></div><div class="kpi"><span>In Bearbeitung</span><strong id="kpiWork">–</strong></div><div class="kpi"><span>Verbesserungen</span><strong id="kpiIdeas">–</strong></div><div class="kpi"><span>Archiv</span><strong id="kpiArchive">–</strong></div></div>
  <div class="toolbar"><div class="filters"><button class="filter active" data-filter="active">Aktiv</button><button class="filter" data-filter="support">Support</button><button class="filter" data-filter="verbesserung">Verbesserungen</button><button class="filter" data-filter="archiv">Archiv</button></div><input class="search" id="search" type="search" placeholder="Firma, E-Mail, Titel oder Text …"></div>
  <section class="card"><div id="list" class="table-wrap"><div class="empty">Wird geladen …</div></div></section>
</div>
<div class="denied hidden" id="denied"><h2>Kein Admin-Zugriff</h2><p>Dieser Bereich ist nur für interne ÜbergabeCheck-Administratoren freigeschaltet.</p><button class="btn primary" onclick="location.href='app.html'">Zurück zu Business</button></div>
<script>
const SUPABASE_URL="https://fkirkglhcpltxlcsozmd.supabase.co";
const SUPABASE_KEY="sb_publishable_lNeX7Hrtp9-FFl3NVb_Gaw_O-21yXWr";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let rows=[],filter="active",currentUser=null;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=v=>v?new Intl.DateTimeFormat("de-DE",{dateStyle:"short",timeStyle:"short"}).format(new Date(v)):"–";
const categoryLabel=v=>({fehler:"Fehler",frage:"Frage",support:"Support",verbesserung:"Verbesserung"}[v]||v);
const statusLabel=v=>({eingegangen:"Eingegangen",in_bearbeitung:"In Bearbeitung",geplant:"Geplant",umgesetzt:"Umgesetzt",abgelehnt:"Nicht umgesetzt",erledigt:"Erledigt"}[v]||v);
const terminal=x=>x.category==="verbesserung"?["umgesetzt","abgelehnt"].includes(x.status):x.status==="erledigt";
function statusOptions(x){const list=x.category==="verbesserung"?[["eingegangen","Eingegangen"],["in_bearbeitung","Wird geprüft"],["geplant","Geplant"],["umgesetzt","Umgesetzt"],["abgelehnt","Nicht umgesetzt"]]:[["eingegangen","Eingegangen"],["in_bearbeitung","In Bearbeitung"],["erledigt","Erledigt"]];return list.map(([v,l])=>`<option value="${v}"${x.status===v?' selected':''}>${l}</option>`).join("");}
function pillClass(x){if(x.category==="fehler")return"error";if(x.category==="verbesserung")return"idea";return"";}
function applyFilter(){const q=document.getElementById("search").value.trim().toLowerCase();return rows.filter(x=>{if(filter==="active"&&x.archived_at)return false;if(filter==="archiv"&&!x.archived_at)return false;if(filter==="support"&&(x.archived_at||x.category==="verbesserung"))return false;if(filter==="verbesserung"&&(x.archived_at||x.category!=="verbesserung"))return false;if(q&&!([x.company_name,x.sender_name,x.sender_email,x.title,x.details,x.admin_note].join(" ").toLowerCase().includes(q)))return false;return true;});}
function render(){
  const list=applyFilter(),target=document.getElementById("list");
  if(!list.length){target.innerHTML='<div class="empty">Keine passenden Einträge.</div>';return;}
  target.innerHTML=`<table class="table"><thead><tr><th>Datum</th><th>Firma / Absender</th><th>Art</th><th>Anfrage</th><th>Status</th><th>Antwort</th><th>Aktion</th></tr></thead><tbody>${list.map(x=>`<tr><td>${esc(fmt(x.created_at))}</td><td class="company"><strong>${esc(x.company_name||'Unbekannt')}</strong><small>${esc(x.sender_name||'')}<br>${esc(x.sender_email||'')}</small></td><td><span class="pill ${pillClass(x)}">${esc(categoryLabel(x.category))}</span></td><td class="subject"><strong>${esc(x.title)}</strong><div class="details">${esc(x.details)}</div></td><td>${x.archived_at?'<span class="pill done">Archiviert</span>':`<select class="status-select" data-status="${esc(x.id)}">${statusOptions(x)}</select>`}</td><td><textarea class="reply" data-reply="${esc(x.id)}" placeholder="Antwort an den Kunden …">${esc(x.admin_note||'')}</textarea></td><td><div class="row-actions"><button class="save" data-save="${esc(x.id)}">Antwort speichern</button>${x.archived_at?`<button class="restore" data-restore="${esc(x.id)}">Wiederherstellen</button>`:(terminal(x)?`<button class="archive" data-archive="${esc(x.id)}">Archivieren</button>`:'')}</div></td></tr>`).join("")}</tbody></table>`;
}
function updateKpis(){document.getElementById("kpiOpen").textContent=rows.filter(x=>!x.archived_at&&x.status==="eingegangen").length;document.getElementById("kpiWork").textContent=rows.filter(x=>!x.archived_at&&["in_bearbeitung","geplant"].includes(x.status)).length;document.getElementById("kpiIdeas").textContent=rows.filter(x=>!x.archived_at&&x.category==="verbesserung").length;document.getElementById("kpiArchive").textContent=rows.filter(x=>!!x.archived_at).length;}
async function load(){const target=document.getElementById("list");target.innerHTML='<div class="empty">Wird geladen …</div>';const {data,error}=await client.from("business_feedback").select("id,company_id,user_id,category,title,details,status,company_name,sender_name,sender_email,admin_note,archived_at,created_at,updated_at").order("created_at",{ascending:false});if(error){console.error(error);target.innerHTML='<div class="empty">Daten konnten nicht geladen werden.</div>';return;}rows=data||[];updateKpis();render();}
async function patch(id,payload){const {error}=await client.from("business_feedback").update(payload).eq("id",id);if(error){console.error(error);alert("Änderung konnte nicht gespeichert werden.");return false;}await load();return true;}
async function init(){const {data:{session}}=await client.auth.getSession();currentUser=session?.user||null;if(!currentUser){location.replace("app.html");return;}const {data,error}=await client.from("app_admins").select("user_id").eq("user_id",currentUser.id).maybeSingle();if(error||!data){document.getElementById("adminApp").classList.add("hidden");document.getElementById("denied").classList.remove("hidden");return;}document.getElementById("adminIdentity").textContent=currentUser.email||"Admin";await load();}
document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));render();}));document.getElementById("search").addEventListener("input",render);document.getElementById("refresh").addEventListener("click",load);
document.addEventListener("change",async e=>{const el=e.target.closest("[data-status]");if(!el)return;await patch(el.dataset.status,{status:el.value});});
document.addEventListener("click",async e=>{const save=e.target.closest("[data-save]");if(save){const ta=document.querySelector(`[data-reply="${CSS.escape(save.dataset.save)}"]`);save.disabled=true;await patch(save.dataset.save,{admin_note:ta?.value.trim()||""});save.disabled=false;return;}const arc=e.target.closest("[data-archive]");if(arc){arc.disabled=true;await patch(arc.dataset.archive,{archived_at:new Date().toISOString()});arc.disabled=false;return;}const restore=e.target.closest("[data-restore]");if(restore){restore.disabled=true;await patch(restore.dataset.restore,{archived_at:null});restore.disabled=false;}});
client.auth.onAuthStateChange((_event,session)=>{if(!session)location.replace("app.html");});init();
</script>
</body>
</html>
